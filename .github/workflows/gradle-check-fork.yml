name: Gradle Check (Fork)
# The upstream "Gradle Check (Jenkins)" job triggers a Jenkins run via secrets
# that are unavailable on forks, so it is skipped on fork PRs. This workflow is
# a fork-only substitute that runs the same `./gradlew check` task upstream
# runs on every PR (unit tests, internalClusterTest, REST tests, and all
# precommit/static checks), giving PRs against fork branches (e.g.
# 3.7-wlm-throttling) equivalent coverage.
#
# NOTE: upstream runs this on a single-executor M7a.8xlarge (32 vCPU / 128 GB)
# because gradle-check is memory-bound and flaky on smaller hosts. GitHub-hosted
# ubuntu-latest runners are far smaller (4 vCPU / 16 GB), so the full check may
# be slow, flaky, or hit the timeout here. It uses the `pull_request` trigger
# (not `pull_request_target`) so PR code never runs with secret access.
on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-files:
    if: github.repository == 'dzane17/OpenSearch'
    runs-on: ubuntu-latest
    outputs:
      RUN_GRADLE_CHECK: ${{ steps.changed-files-specific.outputs.any_changed }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Get changed files
        id: changed-files-specific
        uses: tj-actions/changed-files@22103cc46bda19c2b464ffe86db46df6922fd323 # v47.0.5
        with:
          files_ignore: |
            release-notes/*.md
            .github/**
            *.md

  gradle-check-fork:
    needs: check-files
    if: needs.check-files.outputs.RUN_GRADLE_CHECK == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 130
    steps:
      - name: Remove unnecessary files
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          java-version: 21
          distribution: temurin
          cache: gradle
      - name: Run Gradle (check)
        shell: bash
        run: |
          ./gradlew check
